services:
    db:
        image: postgres:15-alpine
        restart: always
        ports:
            - "127.0.0.1:5432:5432"
        environment:
            - POSTGRES_DB=${POSTGRES_DB}
            - POSTGRES_USER=${POSTGRES_USER}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
        volumes:
            - postgres_data:/var/lib/postgresql/data

    backend:
        build: ./backend
        restart: always
        ports:
            - "8000:8000"
        environment:
            - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
        depends_on:
            - db

    frontend:
        build: ./frontend
        restart: always
        ports:
            - "5173:80"
        depends_on:
            - backend

volumes:
    postgres_data:
